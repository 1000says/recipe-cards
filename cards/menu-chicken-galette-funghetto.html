<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>献立の流れ</title><style>:root{--paper:#FAFAF7;--ink:#161616;--sub:#6A6A6A;--line:#E6E4DC;}body{font-family:Hiragino Sans,sans-serif;background:var(--paper);color:var(--ink);line-height:1.7;margin:0}#o{max-width:720px;margin:0 auto;padding:28px 20px}h1{font-size:28px;line-height:1.3}li{margin:0 0 8px}</style></head><body><div id="o"><h1>献立の流れ：鶏ラビゴット、ガレット、フンゲット</h1><p>総時間約50分。COSORIはなす→鶏。肉とガレットは熱々。フンゲットとソースは常温。</p><h2>時計</h2><ol><li>0:00 ラビゴット乳化。鶏に塩。なすに塩</li><li>0:15 なす COSORI 180C 14分</li><li>0:22 ガレット片面。なすはトマトと合わせ常温</li><li>0:30 鶏 190C 18分。ガレットを返す</li><li>0:48 鶏を3分休ませて盛る</li></ol></div></body></html>
